
name: Validate Membership Feature Branch

on:
  push:
    branches:
      - feature/basic-membership-enrollment
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate JavaScript and Prisma
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: postgresql://prisma_validation:unused@localhost:5432/validation

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check server.js syntax
        run: node --check server.js

      - name: Install dependencies
        run: npm install --package-lock=false

      - name: Validate Prisma schema
        run: npx --no-install prisma validate
